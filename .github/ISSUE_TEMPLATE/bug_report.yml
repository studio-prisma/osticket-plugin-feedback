name: Bug report
description: Something does not work as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please do **not** paste ticket contents, customer names, e-mail addresses or
        feedback links into this form. Redact hostnames if they are not public.

        If a link can be forged, reused for another ticket, or reveals ticket data,
        this is a security issue: report it privately via the security link, not here.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you expect, and what happened instead?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Reply to a ticket as an agent
        2. Close it with status "Resolved"
        3. ...
    validations:
      required: true

  - type: input
    id: osticket-version
    attributes:
      label: osTicket version
      placeholder: "1.18.4"
    validations:
      required: true

  - type: input
    id: php-version
    attributes:
      label: PHP version
      placeholder: "8.3.33"
    validations:
      required: true

  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      placeholder: "0.1.0"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Who gets asked (trigger, exceptions)
        - Feedback mail or line under the closing reply
        - Click page
        - Note, reopen or assignment after a rating
        - Evaluation page
        - Plugin configuration
        - Other / unclear
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: When to ask
      options:
        - Own mail on close
        - Line under the closing reply
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      description: PHP error log entries containing "feedback". Redact IPs if needed.
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I have removed all customer data and feedback links from this report
          required: true
